<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>El Pollo Loco</title>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/clouds.class.js"></script>
    <script src="models/bottles.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-coins.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/backgound-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>

<body>

    <h1>El Pollo Loco</h1>

    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="startScreen" class="screen">
         <img class= "screen-img" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startbildschirm">
            <button class="button" onclick="startGame()">Start</button>
        </div>
        <div id="winScreen" class="screen d-none">
            <img class= "screen-img" src="img/You won, you lost/You won A.png" alt="Gewonnen">
            <button class="button" onclick="restartGame()">Neustart</button>
        </div>
        <div id="loseScreen" class="screen d-none">
            <img class= "screen-img" src="img/You won, you lost/You lost b.png" alt="Verloren">
            <button class="button" onclick="restartGame()">Neustart</button>
        </div>
    </div>

</body>

</html>
